name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Fetch Windows ffmpeg for ALAC playback
        shell: bash
        run: |
          mkdir -p build/bin/win && curl -sL https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-win32-x64.gz | gunzip > build/bin/win/ffmpeg.exe
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: echocellar-windows-installer
          path: release/*.exe
      - name: Attach installer to a GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
